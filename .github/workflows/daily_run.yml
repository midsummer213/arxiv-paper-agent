name: Daily Paper Crawler
on:
  schedule:
    # UTC 09:00 = 北京时间17:00（下午5点）
    - cron: '0 9 * * *'
  workflow_dispatch:

# ⚠️ 必须加这一行，赋予 GITHUB_TOKEN 写入权限
permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python paper_agent.py

      - name: Commit updated paper id record
        run: |
          # 使用 --local 避免污染全局配置
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果文件不存在，说明首次运行没生成，跳过提交防止报错
          if [ -f sent_paper_ids.txt ]; then
            git add sent_paper_ids.txt
            
            # 如果没有变动，跳过 commit 和 push
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "auto update sent paper ids [skip ci]"
              
              # 同步远程代码，防止冲突
              git pull --rebase origin main
              git push
            fi
          else
            echo "sent_paper_ids.txt not found, skip commit."
          fi

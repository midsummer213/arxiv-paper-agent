name: Daily Paper Crawler
on:
  schedule:
    # UTC 09:00 = 北京时间17:00（下午5点）
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the Agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python paper_agent.py

      - name: Commit updated paper id record
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add sent_paper_ids.txt
          git commit -m "auto update sent paper ids [skip ci]" || echo "No new paper id to commit"
          git push
